[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffxiv-mount-tracker-cli"
version = "0.1.0"
description = "Python CLI for FFXIV players to log collected mounts: source, rarity, and acquisition date, with local JSON storage and CSV export."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Asdale Dynamics, LLC"}]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Games/Entertainment :: Role-Playing",
]

[project.scripts]
ffxiv-mount-tracker = "ffxiv_mount_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["ffxiv_mount_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
